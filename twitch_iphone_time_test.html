<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>🐥 Twitch iPhone 再生時刻テスト</title>
<style>
*{box-sizing:border-box}body{background:#fff9ef;color:#57472d;font-family:-apple-system,BlinkMacSystemFont,'Hiragino Kaku Gothic ProN',sans-serif;margin:0}main{max-width:700px;margin:auto;padding:16px}h1{font-size:22px}.panel{background:white;border:1px solid #eadaba;border-radius:16px;padding:14px;margin:12px 0}input{width:100%;font-size:16px;padding:12px;border:1px solid #d8c6a6;border-radius:10px}button{font:inherit;font-weight:bold;background:#ffe19a;border:0;padding:12px;border-radius:11px;margin-top:9px}button:disabled{opacity:.5}.time{font-variant-numeric:tabular-nums;font-size:30px;text-align:center;font-weight:800}.small{font-size:13px;color:#786950;line-height:1.6}.scroll{overflow-x:auto;background:#171923;border-radius:12px}#holder{min-width:400px;width:100%;height:300px}#holder iframe{display:block}pre{overflow-wrap:anywhere;white-space:pre-wrap;background:#f6f2e9;border-radius:8px;padding:10px;font-size:12px;max-height:240px;overflow:auto}.warning{background:#fff0c5;border-radius:10px;padding:12px}#diag{font-size:14px;line-height:1.8}
</style></head><body><main>
<h1>🐥 Twitch iPhone 再生時刻テスト</h1>
<p class="warning">これは<strong>診断専用</strong>だよ。リアクション送信・スプレッドシート連携はなく、本番の記録も変更しません。</p>
<section class="panel"><label for="url"><strong>TwitchアーカイブURL</strong></label><input id="url" type="url" placeholder="https://www.twitch.tv/videos/1234567890"><button id="load">動画を読み込む</button><p id="status" class="small">SafariでTwitchのアーカイブを読み込んでね。</p></section>
<section class="panel"><div class="scroll"><div id="holder"></div></div><p class="small">Twitch公式の埋め込みプレイヤー。iPhoneでは画面を左右に動かす場合があります。</p><div class="time" id="time">00:00:00</div><div id="diag">プレイヤー待機中</div><button id="check">現在の再生時刻を確認</button><p class="small">動画を実際に20〜30秒再生し、表示が変わるか確認してね。動画内の再生ボタンを使ってね。</p></section>
<section class="panel"><strong>確認ログ</strong><pre id="log">まだ記録はありません。</pre><button id="copy">診断結果をコピー</button><p class="small">URLや動画IDはコピー内容に含めません。</p></section>
<script src="https://player.twitch.tv/js/embed/v1.js"></script>
<script>
'use strict';
const $=id=>document.getElementById(id);
let player=null,ready=false,playing=false,attempts=0,lastVal=null,changes=0,seenPositive=false,timer=null,logs=[];
const fmt=t=>{t=Math.max(0,Math.floor(t||0));return [Math.floor(t/3600),Math.floor(t/60)%60,t%60].map(v=>String(v).padStart(2,'0')).join(':')};
function log(s){const now=new Date().toLocaleTimeString('ja-JP');logs.push(now+' '+s);logs=logs.slice(-40);$('log').textContent=logs.join('\n')}
function check(){if(!player){log('プレイヤーがありません');return;}attempts++;
 let raw,err='なし';try{raw=player.getCurrentTime()}catch(e){err=String(e&&e.message||e);raw=undefined}
 const n=Number(raw);const good=raw!==null&&raw!==undefined&&Number.isFinite(n)&&n>=0;
 if(good){$('time').textContent=fmt(n);if(lastVal!==null&&Math.abs(n-lastVal)>.2)changes++;lastVal=n;if(n>0)seenPositive=true}
 $('diag').textContent=`READY: ${ready} / PLAYING: ${playing} / getCurrentTime(): ${String(raw)} / 変化回数: ${changes} / 取得エラー: ${err}`;
 if(attempts<=5||attempts%5===0||err!=='なし'||(good&&changes===1))log(`時刻確認 #${attempts}: ${String(raw)}秒 / READY=${ready} PLAYING=${playing} 変化=${changes} エラー=${err}`);
}
$('check').onclick=()=>{check();log('手動確認ボタンを押した')};
$('load').onclick=()=>{
 let id='';try{const u=new URL($('url').value.trim());if(['www.twitch.tv','twitch.tv','m.twitch.tv'].includes(u.hostname.toLowerCase()))id=(u.pathname.match(/^\/videos\/(\d+)\/?$/)||[])[1]||'';}catch(e){}
 if(!id){$('status').textContent='TwitchのアーカイブURLを入力してね。';return;}
 if(!window.Twitch||!Twitch.Player){$('status').textContent='Twitchの公式プレイヤーが読み込めません。';return;}
 if(location.protocol!=='https:'){$('status').textContent='GitHub Pages（https）で開いてね。';return;}
 if(timer)clearInterval(timer);ready=false;playing=false;attempts=0;lastVal=null;changes=0;seenPositive=false;logs=[];$('log').textContent='';$('time').textContent='00:00:00';$('diag').textContent='プレイヤーを準備中';
 $('holder').replaceChildren();$('status').textContent='動画を読み込み中…';
 try{player=new Twitch.Player('holder',{video:id,width:'100%',height:300,autoplay:false,muted:false,parent:[location.hostname]});
 const add=(event,fn)=>{try{player.addEventListener(event,fn)}catch(e){log('イベント登録不可: '+String(e.message||e))}};
 add(Twitch.Player.READY,()=>{ready=true;log('READYイベント');$('status').textContent='準備完了。動画内の再生ボタンで再生してね。';check()});
 add(Twitch.Player.PLAY,()=>{log('PLAYイベント')});
 add(Twitch.Player.PLAYING,()=>{playing=true;log('PLAYINGイベント');check()});
 add(Twitch.Player.PAUSE,()=>{playing=false;log('PAUSEイベント')});
 add(Twitch.Player.ENDED,()=>{playing=false;log('ENDEDイベント')});
 add(Twitch.Player.PLAYBACK_BLOCKED,()=>log('PLAYBACK_BLOCKEDイベント'));
 timer=setInterval(check,2000);log('プレイヤー作成');
 }catch(e){$('status').textContent='エラー：'+e.message;log('プレイヤー作成エラー '+e.message)}
};
$('copy').onclick=async()=>{const s=['iPhone Twitch診断（動画IDなし）','User agent: '+navigator.userAgent,'READY='+ready,'PLAYING='+playing,'確認回数='+attempts,'時刻変化回数='+changes,'0秒超え='+seenPositive,...logs].join('\n');try{await navigator.clipboard.writeText(s);$('status').textContent='診断結果をコピーしたよ！'}catch(e){$('status').textContent='コピーできない場合はログ部分のスクリーンショットを送ってね。'}};
</script></main></body></html>
