<!DOCTYPE html>
<html lang="ja"><head><base target="_top"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta charset="utf-8">
<title>ああんおおん発見器byとりりん</title>
<style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#443628;background:#fffaf1}*{box-sizing:border-box}body{margin:0}main{max-width:740px;margin:auto;padding:18px 14px 48px}h1{font-size:1.5rem;margin:8px 0}p{line-height:1.5}.muted{color:#776b60;font-size:.9rem}.panel{background:white;border:1px solid #eadcca;border-radius:16px;padding:15px;margin:14px 0;box-shadow:0 2px 9px #7050220b}label{display:block;font-weight:650;margin:9px 0 5px}input{width:100%;font-size:16px;border:1px solid #d4c5b5;border-radius:9px;padding:11px}button{border:0;border-radius:12px;padding:13px 15px;font-size:1rem;font-weight:700;cursor:pointer}button:disabled{opacity:.5;cursor:default}.action{background:#f3cc6d}.small{background:#f2eee7;padding:9px 12px;font-size:.9rem}.controls{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.buttons{display:grid;grid-template-columns:1fr 1fr;gap:10px}.buttons button{min-height:65px}.buttons button:last-child{grid-column:span 2}.pink{background:#f7c9db}.blue{background:#cde7ff}.gold{background:#ffe3a3}#player{width:100%;aspect-ratio:16/9;background:#eee;border-radius:10px;overflow:hidden}#player iframe{width:100%;height:100%}#records{padding-left:24px}#records li{padding:5px 0}#records button{margin-left:8px}.submit{width:100%;background:#e4b73f}#status{white-space:pre-wrap;min-height:22px} .warn{color:#a23c25}
</style></head><body><main>
<h1>🐥 ああんおおん発見器 by とりりん</h1><p class="muted">配信の「ああん」「おおん」を見つけて、とりりんの切り抜きAI育成を手伝ってね！</p>
<section class="panel"><label for="nickname">ニックネーム（任意）</label><input id="nickname" maxlength="30" placeholder="空欄なら匿名"><label for="url">YouTubeアーカイブのURL</label><input id="url" placeholder="https://www.youtube.com/watch?v=..." inputmode="url"><div class="controls"><button class="action" id="load">動画を開く</button></div></section>
<section class="panel"><div id="player"></div><p id="playerStatus" class="muted" role="status">YouTubeプレイヤーを準備しています…</p><div class="controls"><button class="small" id="back">−5秒</button><button class="small" id="play">再生／一時停止</button><button class="small" id="forward">＋5秒</button></div><p class="muted">再生時刻：<strong id="clock">00:00</strong>　※広告中は登録しないでね</p></section>
<section class="panel"><div class="buttons"><button class="pink" data-label="ああん">♡ ああん</button><button class="blue" data-label="おおん">おおん！</button><button class="gold" data-label="ナイスリアクション">★ ナイスリアクション！</button></div><p class="muted">声が聞こえた瞬間に押してね。あとから削除・時刻修正もできるよ。</p></section>
<section class="panel"><h2>登録履歴 <span id="count">0</span>件</h2><ol id="records"></ol><button class="small" id="clear">全件削除</button></section>
<section class="panel"><h2>とりりんに送信</h2><p class="muted">登録した動画ID・時刻・リアクション・任意のお名前を送信します。送信後も履歴は端末に残ります。※送信結果はこの画面だけでは確定できません。</p><button class="submit" id="send">内容を確認して送信</button><p id="status" role="status"></p></section>
</main><script>
let player=null,ready=false,videoId='',items=[],batchId='';const $=id=>document.getElementById(id);const STORE='toririn_github_listener_v1';
function save(){localStorage.setItem(STORE,JSON.stringify({videoId,items,batchId,nickname:$('nickname').value,url:$('url').value}));}
function restore(){try{const s=JSON.parse(localStorage.getItem(STORE)||'{}');videoId=s.videoId||'';items=Array.isArray(s.items)?s.items:[];batchId=s.batchId||'';$('nickname').value=s.nickname||'';$('url').value=s.url||'';}catch(e){} render();}
function parseId(v){try{const u=new URL(v);if(u.hostname==='youtu.be'||u.hostname==='www.youtu.be')return u.pathname.slice(1).split('/')[0];if(['youtube.com','www.youtube.com','m.youtube.com','youtube-nocookie.com','www.youtube-nocookie.com'].includes(u.hostname)){if(u.pathname.startsWith('/shorts/')||u.pathname.startsWith('/live/')||u.pathname.startsWith('/embed/'))return u.pathname.split('/')[2];return u.searchParams.get('v');}}catch(e){}return null;}
function fmt(s){s=Math.max(0,Math.floor(s||0));return Math.floor(s/3600)?`${Math.floor(s/3600)}:${String(Math.floor(s%3600/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`:`${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;}
function render(){const list=$('records');list.replaceChildren();$('count').textContent=items.length;items.forEach((item,i)=>{const li=document.createElement('li');li.append(document.createTextNode(fmt(item.time_seconds)+'　'+item.label+' '));const edit=document.createElement('button');edit.className='small';edit.textContent='時刻修正';edit.onclick=()=>{const val=prompt('再生時刻（秒）',String(item.time_seconds));if(val===null)return;const n=Number(val);if(!Number.isFinite(n)||n<0||n>86400)return alert('0〜86400の数字を入力してね');item.time_seconds=Math.round(n*10)/10;batchId='';save();render();};const del=document.createElement('button');del.className='small';del.textContent='削除';del.onclick=()=>{items.splice(i,1);batchId='';save();render();};li.append(edit,del);list.append(li);});}
function loadVideo(){const id=parseId($('url').value.trim());if(!id||!/^[A-Za-z0-9_-]{11}$/.test(id))return alert('YouTube動画のURLを確認してね');if(videoId&&videoId!==id&&items.length&&!confirm('別の動画に切り替えると登録履歴が消えるよ。切り替える？'))return;if(videoId!==id){items=[];batchId='';}videoId=id;save();render();if(ready){try{player.loadVideoById(id);setPlayerMessage('動画を読み込み中…');}catch(err){setPlayerMessage('読み込みエラー：'+err.message);}}else {setPlayerMessage('YouTubeプレイヤーの準備待ちです。しばらく待っても変わらなければ、このページを再読み込みしてください。');}}}
function setPlayerMessage(message){$('playerStatus').textContent=message;}
window.onYouTubeIframeAPIReady=function(){
  setPlayerMessage('YouTubeプレイヤーを初期化しています…');
  try {player=new YT.Player('player',{height:'390',width:'640',videoId:videoId||undefined,playerVars:{playsinline:1,rel:0},events:{
    onReady:()=>{ready=true;setPlayerMessage('準備完了。動画を開くボタンを押してください。');if(videoId)player.cueVideoById(videoId);},
    onError:(event)=>{const messages={2:'動画IDが正しくありません',5:'動画を再生できません',100:'動画が見つからないか非公開です',101:'この動画は埋め込み再生が許可されていません',150:'この動画は埋め込み再生が許可されていません',153:'YouTube側が再生環境を確認できません（エラー153）'};setPlayerMessage('YouTubeエラー '+event.data+'：'+(messages[event.data]||'再生に失敗しました'));},
    onStateChange:(event)=>{if(event.data===YT.PlayerState.PLAYING)setPlayerMessage('再生中');}
  }});}catch(err){setPlayerMessage('プレイヤー初期化エラー：'+err.message);}
};
window.addEventListener('error',event=>{if(!ready)setPlayerMessage('読み込みエラー：'+event.message);});
setTimeout(()=>{if(!ready)setPlayerMessage('YouTubeプレイヤーが準備できません。ブラウザの制限や埋め込み環境が原因の可能性があります。');},12000);
$('load').onclick=loadVideo;$('nickname').oninput=save;
$('back').onclick=()=>{if(ready)player.seekTo(Math.max(0,player.getCurrentTime()-5),true);};$('forward').onclick=()=>{if(ready)player.seekTo(player.getCurrentTime()+5,true);};$('play').onclick=()=>{if(!ready)return;player.getPlayerState()===YT.PlayerState.PLAYING?player.pauseVideo():player.playVideo();};
document.querySelectorAll('[data-label]').forEach(btn=>btn.onclick=()=>{if(!ready||!videoId)return alert('先に動画を開いてね');const t=player.getCurrentTime();if(!Number.isFinite(t))return;items.push({time_seconds:Math.round(t*10)/10,label:btn.dataset.label});batchId='';save();render();});
$('clear').onclick=()=>{if(confirm('登録履歴をすべて削除する？')){items=[];batchId='';save();render();}};
const ENDPOINT='https://script.google.com/macros/s/AKfycbzdvhoFwJY5pUaV3rPWkzW0RxriVtE-UzrzaXl2UGkU8V3P6_WH7vAZFaNn16DQHi8_eQ/exec';
$('send').onclick=async()=>{
 if(!videoId||!items.length)return alert('先にリアクションを登録してね');
 if(items.length>100)return alert('100件ずつ送信してね');
 if(!confirm(`${items.length}件を送信する？\nお名前：${$('nickname').value.trim()||'匿名'}`))return;
 if(!batchId){batchId='b'+Date.now().toString(36)+Math.random().toString(36).slice(2,14);save();}
 const btn=$('send');btn.disabled=true;$('status').textContent='送信中…';
 try{
  const payload={nickname:$('nickname').value,video_id:videoId,items,batch_id:batchId};
  // Apps Script does not support cross-origin response reading from GitHub Pages.
  // no-cors means the response cannot be verified: never claim confirmed success.
  await fetch(ENDPOINT,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload)});
  $('status').textContent='送信リクエストを出しました。ただしブラウザの制限で成功確認はできません。まず管理者がスプレッドシートへの記録を確認してください。';
 }catch(err){$('status').textContent='送信できませんでした：'+err.message+'。記録は端末に残っています。';}
 finally{btn.disabled=false;}
};
restore();setInterval(()=>{if(ready&&player&&typeof player.getCurrentTime==='function')$('clock').textContent=fmt(player.getCurrentTime());},500);
</script><script src="https://www.youtube.com/iframe_api"></script></body></html>
